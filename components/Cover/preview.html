<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stateXchange</title>
<style>
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-display);overflow:hidden}
.cover{position:relative;width:960px;height:288px;overflow:hidden}
.band{position:absolute;left:0;top:0;width:960px;height:112px}
.band svg{display:block}
.mid{fill:var(--logo-base)}
.ele{fill:var(--logo-accent)}
.tint{fill:var(--accent-soft)}
.deep{fill:var(--ink)}
.cut{fill:var(--bg)}
.words{position:absolute;left:var(--space-5);bottom:var(--space-5);max-width:900px}
.name{margin:0;font-size:64px;line-height:.95;font-weight:700;letter-spacing:-.02em;color:var(--logo-text);white-space:nowrap}
.name span{color:var(--logo-accent)}
.tag{margin:var(--space-2) 0 0 3px;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      logo-base 336 wide bled off the top-left (the Midnight the brand is known by) · logo-accent 192 (Electric, the X) · accent-soft 144 tint · ink 240 slab bleeding off the right — ≈40% of 960x288
  arrangement top-band skeleton (the name is too wide for the 440 zone): a strip of unequal bands, flush, space-3 gutters, bottoms on one line at 96
  pattern     the logo's own motif — its angular stroke pairs — as 8 parallelogram cuts at a space-7 pitch through the Midnight and Electric bands, in the ground colour
  scales      widths in space-7 (48) multiples; gutters space-3 (12); pitch space-7; corners radius-md on the bottom edges only (square tops bleed)
-->
<rect class="mid" x="0" y="-16" width="336" height="112" rx="10"/>
<rect class="ele" x="348" y="-16" width="192" height="112" rx="10"/>
<rect class="tint" x="552" y="-16" width="144" height="112" rx="10"/>
<rect class="deep" x="708" y="-16" width="264" height="112" rx="10"/>
<g class="cut">
<polygon points="48,96 72,96 120,0 96,0"/>
<polygon points="96,96 120,96 168,0 144,0"/>
<polygon points="144,96 168,96 216,0 192,0"/>
<polygon points="192,96 216,96 264,0 240,0"/>
<polygon points="240,96 264,96 312,0 288,0"/>
<polygon points="396,96 420,96 468,0 444,0"/>
<polygon points="444,96 468,96 516,0 492,0"/>
</g>
</svg>
</div>
<div class="words">
<p class="name">state<span>X</span>change</p>
<p class="tag">Analytics · Data · Strategy · Trading · Quant — the Mono Blue UI system.</p>
</div>
</div>
</body>
</html>

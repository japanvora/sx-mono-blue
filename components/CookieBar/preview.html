<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CookieBar — preview</title>
<style>
html,body{margin:0}
body{padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
</style>
</head>
<body class="sx">
<div id="root">
<div class="sx-cookie" data-sx-key="sx-preview-consent" style="position:relative;left:auto;right:auto;bottom:auto;box-shadow:none">
<p class="sx-cookie__text">We use only the cookies needed to run this site and to remember your theme. No advertising or tracking cookies.</p>
<div class="sx-cookie__actions"><a class="sx-btn sx-btn--ghost sx-btn--sm" href="#">Privacy policy</a><button class="sx-btn sx-btn--secondary sx-btn--sm" type="button" data-sx-consent="essential">Essential only</button><button class="sx-btn sx-btn--sm" type="button" data-sx-consent="all">Accept</button></div>
</div>
</div>

</body>
</html>
